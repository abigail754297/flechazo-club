    <div class="hidden" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;">
        <div id="youtube-audio-player"></div>
    </div>

    <script>
        var player;
        var isPlaying = false;

        // Load YouTube IFrame API dynamically
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-audio-player', {
                height: '1',
                width: '1',
                videoId: 'fceUn6ZXLek', // Background song ID
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'fceUn6ZXLek',
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('audio-status-text').innerText = 'Toca cualquier lugar para activar la música';
            
            // Automatic playback trigger on user interaction (bypasses browser autoplay restrictions)
            const handleFirstInteraction = () => {
                if (!isPlaying && player && typeof player.playVideo === 'function') {
                    player.playVideo();
                }
                document.removeEventListener('click', handleFirstInteraction);
                document.removeEventListener('touchstart', handleFirstInteraction);
            };

            document.addEventListener('click', handleFirstInteraction);
            document.addEventListener('touchstart', handleFirstInteraction);
        }

        function onPlayerStateChange(event) {
            var statusText = document.getElementById('audio-status-text');
            var btnIcon = document.getElementById('btn-icon');
            var btnText = document.getElementById('btn-text');
            var audioIcon = document.getElementById('audio-icon');

            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                statusText.innerText = 'Sonando música romántica';
                btnIcon.innerText = '❚❚';
                btnText.innerText = 'Pausar';
                audioIcon.classList.add('animate-bounce');
            } else {
                isPlaying = false;
                statusText.innerText = 'Música pausada';
                btnIcon.innerText = '▶';
                btnText.innerText = 'Reproducir';
                audioIcon.classList.remove('animate-bounce');
            }
        }

        function toggleAudio() {
            if (!player || typeof player.playVideo !== 'function') return;

            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }
    </script>
